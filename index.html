<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Documentation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 { font-size: 28px; margin-bottom: 16px; color: #1a1a2e; }
        p { margin-bottom: 12px; color: #555; }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Project Documentation</h1>
        <p><span class="badge">v1.0</span></p>
        <p>Welcome to the project documentation site. This page hosts technical resources and configuration references for internal development use.</p>
        <p>For detailed API documentation, please refer to the internal wiki.</p>
        <div class="footer">
            <p>&copy; 2026 Development Team. Internal use only.</p>
        </div>
    </div>
</body>
</html>
